<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign In - Emergency Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"></script>
  <style>
    :root {
      --primary-purple: #6D28D9;
      --secondary-teal: #06B6D4;
      --danger-red: #DC2626;
      --text-dark: #111827;
      --text-light: #6B7280;
      --border: #D1D5DB;
      --white: #fff;
      --background: #F9FAFB;
      --card-background: #fff;
      --text-dark-dark: #E5E7EB;
      --text-light-dark: #9CA3AF;
      --border-dark: #374151;
      --white-dark: #1F2937;
      --highlight: #F3F4F6;
      --focus-ring: #8B5CF6;
    }

    [data-theme="dark"] {
      --background: #111827;
      --text-dark: var(--text-dark-dark);
      --text-light: var(--text-light-dark);
      --border: var(--border-dark);
      --white: var(--white-dark);
      --card-background: #1F2937;
      --highlight: #374151;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, opacity 0.5s ease;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
    }

    body.fade-out {
      opacity: 0;
    }

    .container {
      max-width: 400px;
      width: 100%;
      padding: 1.5rem;
      background: var(--card-background);
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--border);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-dark);
      background: var(--white);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--primary-purple);
      box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.2);
    }

    .input-group input::placeholder {
      color: var(--text-light);
    }

    .error-message {
      color: var(--danger-red);
      font-size: 0.8rem;
      margin-top: 0.25rem;
      display: none;
    }

    .error-message.active {
      display: block;
    }

    .signin-button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(90deg, var(--primary-purple), var(--secondary-teal));
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .signin-button:hover,
    .signin-button:focus {
      transform: scale(1.05);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      outline: 2px solid var(--focus-ring);
    }

    .signin-button:active {
      transform: scale(0.95);
    }

    .link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .link a {
      color: var(--primary-purple);
      text-decoration: none;
      font-weight: 500;
    }

    .link a:hover,
    .link a:focus {
      text-decoration: underline;
      outline: none;
    }

    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .spinner-overlay.active {
      display: flex;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid transparent;
      border-top: 5px solid var(--primary-purple);
      border-right: 5px solid var(--secondary-teal);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 767px) {
      .container {
        padding: 1rem;
      }
      .title {
        font-size: 1.25rem;
      }
      .input-group label {
        font-size: 0.85rem;
      }
      .input-group input {
        font-size: 0.85rem;
        padding: 0.5rem;
      }
      .signin-button {
        font-size: 0.9rem;
        padding: 0.5rem;
      }
      .link {
        font-size: 0.85rem;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-width: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Sign In</h1>
    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" aria-label="Email address">
      <div class="error-message" id="email-error">Please enter a valid email.</div>
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" aria-label="Password">
      <div class="error-message" id="password-error">Please enter a valid password.</div>
    </div>
    <button class="signin-button" id="signin-button" aria-label="Sign in">Sign In</button>
    <div class="link">
      Don't have an account? <a href="signup.html">Sign Up as Admin</a>
    </div>
  </div>
  <div class="spinner-overlay" id="spinner-overlay">
    <div class="spinner"></div>
  </div>
  <script type="module">
    // Check if Firebase scripts are loaded
    if (typeof firebase === 'undefined') {
      console.error("Firebase scripts failed to load.");
      window.alert("Failed to load Firebase. Please check your network or try again later.");
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    document.addEventListener("DOMContentLoaded", async () => {
      // Initialize theme with fallback
      let savedTheme = 'light';
      try {
        savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        console.log("Initial theme set to:", savedTheme);
      } catch (error) {
        console.error("Failed to initialize theme from localStorage:", error.message);
        document.documentElement.setAttribute('data-theme', 'light');
      }

      const firebaseConfig = {
        apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
        authDomain: "fire-b-a8878.firebaseapp.com",
        databaseURL: "https://fire-b-a8878.firebaseio.com",
        projectId: "fire-b-a8878",
        storageBucket: "fire-b-a8878.firebasestorage.app",
        messagingSenderId: "658673187627",
        appId: "1:658673187627:web:6e4c29af661785f0afa36e",
        measurementId: "G-V4W97VMSKL"
      };

      let app, auth;
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        console.log("Firebase initialized successfully at", new Date().toLocaleString());
        try {
          await setPersistence(auth, browserLocalPersistence);
          console.log("Persistence set to browserLocalPersistence");
        } catch (error) {
          console.error("Failed to set Firebase persistence:", error.code, error.message);
          showError(null, "Failed to set session persistence. Please try again.");
        }
      } catch (error) {
        console.error("Firebase initialization failed:", error.code, error.message);
        showError(null, "Failed to connect to Firebase. Please check your network.");
        return;
      }

      const signinButton = document.getElementById("signin-button");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const emailError = document.getElementById("email-error");
      const passwordError = document.getElementById("password-error");
      const spinnerOverlay = document.getElementById("spinner-overlay");

      if (!signinButton || !emailInput || !passwordInput || !emailError || !passwordError || !spinnerOverlay) {
        console.error("DOM elements missing:", { signinButton, emailInput, passwordInput, emailError, passwordError, spinnerOverlay });
        showError(null, "Page initialization failed. Please refresh the page.");
        return;
      }

      function showSpinner() {
        spinnerOverlay.classList.add("active");
        console.log("Spinner shown at", new Date().toLocaleString());
      }

      function hideSpinner() {
        spinnerOverlay.classList.remove("active");
        console.log("Spinner hidden at", new Date().toLocaleString());
      }

      function showError(element, message) {
        if (element) {
          element.textContent = message;
          element.classList.add("active");
        } else {
          window.alert(message); // Fallback to alert for general errors
        }
      }

      function clearErrors() {
        emailError.classList.remove("active");
        passwordError.classList.remove("active");
      }

      async function handleSignIn() {
        clearErrors();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError(emailError, "Please enter a valid email.");
          return;
        }

        if (!password) {
          showError(passwordError, "Please enter a password.");
          return;
        }

        showSpinner();
        try {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          console.log("User signed in:", user.uid, user.email);

          document.body.classList.add("fade-out");
          setTimeout(() => window.location.href = "home.html", 500);
        } catch (error) {
          console.error("Sign-in error:", error.code, error.message);
          switch (error.code) {
            case "auth/user-not-found":
            case "auth/wrong-password":
              showError(passwordError, "Invalid email or password.");
              break;
            case "auth/invalid-email":
              showError(emailError, "Invalid email format.");
              break;
            case "auth/too-many-requests":
              showError(passwordError, "Too many attempts. Please try again later.");
              break;
            default:
              showError(null, `Sign-in failed: ${error.message}`);
          }
        } finally {
          hideSpinner();
        }
      }

      signinButton.addEventListener("click", handleSignIn);
      emailInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSignIn();
      });
      passwordInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSignIn();
      });
    });
  </script>
</body>
</html>
