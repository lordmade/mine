<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Verification Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --accent: #00ff88;
      --accent-secondary: #ff00ff;
      --gradient: linear-gradient(135deg, #00ff88 0%, #00b7ff 50%, #ff00ff 100%);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.1);
      --glass: rgba(255, 255, 255, 0.2);
    }
    body.dark {
      --bg: #0f0f23;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.05);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(30px);
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }
    body.dark .header {
      background: rgba(15, 15, 35, 0.95);
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }
    .logout-btn {
      background: #ff0080;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }
    .logout-btn:hover {
      background: #cc0066;
    }
    .main-content {
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-primary);
    }
    .users-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.3s ease;
      backdrop-filter: blur(15px);
    }
    .user-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }
    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      flex-shrink: 0;
    }
    .user-info {
      flex: 1;
      min-width: 0;
    }
    .user-name {
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .user-email {
      color: var(--text-secondary);
      font-size: 14px;
    }
    .verified-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 14px;
    }
    .verified-badge {
      color: var(--accent);
      font-weight: bold;
    }
    .toggle-btn {
      background: var(--gradient);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      min-width: 100px;
    }
    .toggle-btn:hover:not(:disabled) {
      transform: scale(1.05);
    }
    .toggle-btn:disabled {
      background: var(--border);
      color: var(--text-secondary);
      cursor: not-allowed;
      transform: none;
    }
    .spinner {
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 4px;
      animation: spin 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes spin {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    .alert {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--gradient);
      color: #000;
      padding: 12px 20px;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      z-index: 1000;
      font-weight: 600;
      display: none;
    }
    .alert.show {
      display: block;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .search-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--glass);
      color: var(--text-primary);
      font-size: 16px;
    }
    .search-input::placeholder {
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>User Verification Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="alert" id="alert"></div>

  <div class="main-content">
    <div class="search-container">
      <input type="text" id="search-input" class="search-input" placeholder="Search users..." oninput="filterUsers()">
    </div>
    <h2 class="section-title">Users</h2>
    <div id="users-list" class="users-list">
      <!-- Users will be loaded here -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { getDatabase, ref, get, update, onValue } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
      authDomain: "fire-b-a8878.firebaseapp.com",
      databaseURL: "https://fire-b-a8878.firebaseio.com",
      projectId: "fire-b-a8878",
      storageBucket: "fire-b-a8878.firebasestorage.app",
      messagingSenderId: "658673187627",
      appId: "1:658673187627:web:6e4c29af661785f0afa36e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let allUsers = [];

    const verifiedIcon = `<span class="material-icons" style="color: #1DA1F2; font-size: 16px;">verified</span>`;

    function showAlert(message, isError = false) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.style.background = isError ? '#ff4444' : 'var(--gradient)';
      alert.classList.add('show');
      setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function filterUsers() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const userItems = document.querySelectorAll('.user-item');
      userItems.forEach(item => {
        const name = item.querySelector('.user-name').textContent.toLowerCase();
        const email = item.querySelector('.user-email').textContent.toLowerCase();
        if (name.includes(searchTerm) || email.includes(searchTerm)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    async function toggleVerified(uid, currentVerified, buttonEl) {
      // Disable button during operation
      const originalText = buttonEl.textContent;
      buttonEl.disabled = true;
      buttonEl.textContent = 'Updating...';

      try {
        await update(ref(db, `users/${uid}`), { verified: !currentVerified });
        const newStatus = !currentVerified ? 'verified' : 'unverified';
        showAlert(`User ${newStatus} successfully!`);
        loadUsers(); // Reload to update UI
      } catch (error) {
        console.error('Error updating verification:', error);
        showAlert('Failed to update verification. Check Firebase rules.', true);
        // Re-enable button on error
        buttonEl.disabled = false;
        buttonEl.textContent = originalText;
      }
    }

    function renderUser(user) {
      const initial = user.displayName ? user.displayName[0].toUpperCase() : 'U';
      const avatarHtml = user.photoURL 
        ? `<img src="${user.photoURL}" alt="${user.displayName}" class="user-avatar" style="object-fit: cover;">`
        : `<div class="user-avatar">${initial}</div>`;

      const nameHtml = user.displayName || 'Unknown User';
      const verifiedHtml = user.verified ? verifiedIcon : '';

      const buttonText = user.verified ? 'Unverify' : 'Verify';
      const statusText = user.verified ? 'Verified' : 'Unverified';

      return `
        <div class="user-item" data-uid="${user.uid}">
          ${avatarHtml}
          <div class="user-info">
            <div class="user-name">${nameHtml} ${verifiedHtml}</div>
            <div class="user-email">${user.email || 'No email'}</div>
          </div>
          <div class="verified-status">
            <span class="verified-badge">${statusText}</span>
          </div>
          <button class="toggle-btn" onclick="toggleVerified('${user.uid}', ${user.verified}, this)">
            ${buttonText}
          </button>
        </div>
      `;
    }

    async function loadUsers() {
      try {
        const usersRef = ref(db, 'users');
        const snapshot = await get(usersRef);
        if (snapshot.exists()) {
          allUsers = Object.entries(snapshot.val()).map(([uid, user]) => ({ uid, ...user }));
          const usersList = document.getElementById('users-list');
          usersList.innerHTML = allUsers.map(renderUser).join('');
        } else {
          document.getElementById('users-list').innerHTML = '<p>No users found.</p>';
        }
      } catch (error) {
        console.error('Error loading users:', error);
        showAlert('Failed to load users.', true);
      }
    }

    window.logout = async () => {
      try {
        await signOut(auth);
        window.location.href = 'login.html'; // Redirect to login
      } catch (error) {
        console.error('Error signing out:', error);
        showAlert('Failed to sign out.', true);
      }
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        loadUsers();
      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
