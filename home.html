<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok-like AI Chat</title>
  <script src="https://cdn.tailwindcss.com/3.4.14"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/transformers@0.0.4/dist/transformers.min.js"></script>
  <style>
    /* [Existing styles remain unchanged] */
    :root {
      --primary: #1d9bf0;
      --background: #000000;
      --text: #e7e9ea;
      --text-light: #71767b;
      --chat-bg: #15202b;
      --message-bg: #1e2732;
      --ai-message-bg: #22303c;
    }
    /* ... [rest of the styles] ... */
  </style>
</head>
<body>
  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar" id="user-avatar">U</div>
        <span id="username">User</span>
      </div>
      <button id="new-chat-btn">New Chat</button>
      <button id="settings-btn">Settings</button>
      <button id="signout-btn">Sign Out</button>
      <h2>Chat History</h2>
      <div id="chat-history"></div>
    </div>
    <div class="chat-container">
      <div class="chat-header">
        <h1>Grok-like AI</h1>
        <button id="toggle-sidebar">☰</button>
      </div>
      <div class="chat-output" id="chat-output"></div>
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Ask Grok anything..." aria-label="Chat input" />
        <button onclick="sendMessage()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
  </div>
  <div class="toast" id="toast">
    <p id="toast-message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, addDoc, Timestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
      authDomain: "fire-b-a8878.firebaseapp.com",
      databaseURL: "https://fire-b-a8878.firebaseio.com",
      projectId: "fire-b-a8878",
      storageBucket: "fire-b-a8878.firebasestorage.app",
      messagingSenderId: "658673187627",
      appId: "1:658673187627:web:6e4c29af661785f0afa36e",
      measurementId: "G-V4W97VMSKL"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const spinner = document.getElementById("spinner");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toast-message");
    const signoutBtn = document.getElementById("signout-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const toggleSidebar = document.getElementById("toggle-sidebar");
    const sidebar = document.getElementById("sidebar");
    const chatHistory = document.getElementById("chat-history");
    const userAvatar = document.getElementById("user-avatar");
    const usernameElement = document.getElementById("username");
    const newChatBtn = document.getElementById("new-chat-btn");
    const chatOutput = document.getElementById("chat-output");

    let currentConversationId = null;
    let conversations = [];

    function showSpinner() { spinner.classList.add("active"); }
    function hideSpinner() { spinner.classList.remove("active"); }
    function showToast(message) {
      toastMessage.textContent = message;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 3000);
    }
    function formatTimestamp(timestamp) {
      if (timestamp instanceof Timestamp) return timestamp.toDate().toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      return new Date().toLocaleString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }
    function setUserProfile(user) {
      if (user) {
        const displayName = user.displayName || "User";
        usernameElement.textContent = displayName;
        if (user.photoURL) {
          userAvatar.style.background = "none";
          userAvatar.innerHTML = `<img src="${user.photoURL}" alt="User Avatar" style="width: 32px; height: 32px; border-radius: 50%;" />`;
        } else userAvatar.textContent = displayName.charAt(0);
      }
    }
    async function loadUserSettings(user) {
      if (!user) return;
      try {
        const userDocRef = doc(db, `users/${user.uid}`);
        const userDoc = await getDoc(userDocRef);
        if (userDoc.exists()) document.documentElement.setAttribute("data-theme", userDoc.data().theme || "dark");
      } catch (error) {
        console.error("Failed to load user settings:", error.message);
        showToast(`Failed to load settings: ${error.message}`);
      }
    }
    async function checkFirstInteraction(user) {
      if (!user) return false;
      const userDocRef = doc(db, `users/${user.uid}`);
      const userDoc = await getDoc(userDocRef);
      if (!userDoc.exists() || !userDoc.data().firstInteraction) {
        await setDoc(userDocRef, { firstInteraction: true }, { merge: true });
        return true;
      }
      return false;
    }

    const workerCode = `
      let model, tokenizer;

      async function init() {
        try {
          console.log('Initializing model...');
          const modelKey = 'distilbert-model';
          model = await tf.io.browser.fromIndexedDB(modelKey);
          if (!model) {
            console.log('Loading model from CDN...');
            model = await transformers.loadModel('distilbert', 'distilbert-base-uncased-finetuned-sst-2-english');
            console.log('Model loaded, saving to IndexedDB...');
            await model.save(\`indexeddb://\${modelKey}\`);
          }
          console.log('Loading tokenizer...');
          tokenizer = await transformers.loadTokenizer('distilbert', 'distilbert-base-uncased-finetuned-sst-2-english');
          console.log('Model and tokenizer initialized');
        } catch (error) {
          console.error('Model loading failed:', error);
          self.postMessage({ error: `Model initialization error: ${error.message}` });
        }
      }

      function generateHumanLikeResponse(output, inputText, isFirstInteraction, username) {
        if (!output || !output.label || !output.score) {
          console.warn('Invalid output object:', output);
          return 'Error generating response.';
        }
        const sentiment = output.label === 'POSITIVE' ? 'positive' : output.label === 'NEGATIVE' ? 'negative' : 'neutral';
        const confidence = output.score;
        const words = inputText.toLowerCase().split(' ').filter(w => w.length > 3);
        const keyword = words.find(w => ['happy', 'sad', 'great', 'bad', 'okay'].includes(w)) || sentiment;

        const templates = {
          positive: [\`Wow, you're full of \${confidence > 0.8 ? 'amazing' : 'great'} \${keyword} vibes! What's the story?\`, \`That’s super uplifting! What’s sparking this \${keyword} mood?\`, \`Loving this \${keyword} energy! Tell me more!\`, \`You're radiating \${keyword}! What's got you so pumped?\`],
          neutral: [\`Sounds like you're keeping it \${keyword}. What's up?\`, \`Pretty chill \${keyword} vibe! What's on your mind?\`, \`Just cruising with \${keyword}? Got anything exciting to share?\`, \`Keeping it \${keyword}, huh? What's next?\`],
          negative: [\`Sorry you're feeling \${keyword}. Want to talk about it?\`, \`That sounds tough with \${keyword}. I'm here if you need to vent!\`, \`Ouch, a \${keyword} moment? Let’s chat about it.\`, \`Feeling \${keyword}? I'm all ears if you want to share.\`]
        };

        const selectedTemplates = templates[sentiment];
        let response = selectedTemplates[Math.floor(Math.random() * selectedTemplates.length)];
        if (inputText.includes('?')) response += ' By the way, what’s the answer to your question? I’m curious!';
        if (isFirstInteraction && username) response = \`Hey \${username}, welcome to Grok-like AI! \${response}\`;
        return response;
      }

      self.onmessage = async (e) => {
        console.log('Worker received:', e.data);
        const { input, isFirstInteraction, username } = e.data || {};
        if (!input) {
          console.error('No input provided');
          self.postMessage({ error: 'No input provided' });
          return;
        }
        try {
          if (!model) await init();
          console.log('Tokenizing:', input);
          const tokens = await tokenizer.encode(input);
          if (!tokens || tokens.length === 0) throw new Error('Tokenization failed');
          console.log('Tokens generated:', tokens);
          console.log('Predicting with tensor...');
          const tensor = tf.tensor([tokens]);
          const prediction = await model.predict(tensor);
          if (!prediction || !prediction.dataSync) throw new Error('Prediction failed');
          console.log('Prediction result:', prediction);
          const output = { label: prediction.label, score: prediction.score };
          const response = generateHumanLikeResponse(output, input, isFirstInteraction, username);
          self.postMessage({ response });
        } catch (error) {
          console.error('Worker error:', error);
          self.postMessage({ error: `Error processing input: ${error.message}` });
        }
      };
    `;

    const workerBlob = new Blob([workerCode], { type: 'text/javascript' });
    const workerUrl = URL.createObjectURL(workerBlob);
    const worker = new Worker(workerUrl);

    worker.onmessage = (e) => {
      console.log('Worker received data:', e.data);
      const { response, error } = e.data || {};
      const thinkingDiv = chatOutput.querySelector('.thinking-dots');
      if ('vibrate' in navigator) navigator.vibrate(0);
      if (thinkingDiv) chatOutput.removeChild(thinkingDiv);
      const timestamp = formatTimestamp(Timestamp.now());
      if (error) {
        const errorMessage = error || 'Error processing input. Please try again.';
        chatOutput.innerHTML += `<div class="message ai-message">${errorMessage}<span class="timestamp">${timestamp}</span></div>`;
        saveMessageToConversation(errorMessage, 'ai');
        showToast(`Error: ${error}`);
      } else if (response) {
        const messageId = `${currentConversationId}-${conversations.find(c => c?.id === currentConversationId)?.messages?.length || 0}`;
        chatOutput.innerHTML += `
          <div class="message ai-message">
            ${response}
            <span class="timestamp">${timestamp}</span>
            <button class="feedback-btn thumbs-up" data-message-id="${messageId}" aria-label="Thumbs up">👍</button>
            <button class="feedback-btn thumbs-down" data-message-id="${messageId}" aria-label="Thumbs down">👎</button>
          </div>`;
        saveMessageToConversation(response, 'ai');
        document.querySelectorAll('.feedback-btn').forEach(btn => {
          btn.removeEventListener('click', handleFeedback);
          btn.addEventListener('click', handleFeedback);
        });
      }
      chatOutput.scrollTop = chatOutput.scrollHeight;
    };

    function handleFeedback(event) {
      const btn = event.target;
      const messageId = btn.dataset.messageId;
      const isPositive = btn.classList.contains('thumbs-up');
      submitFeedback(messageId, isPositive);
    }

    async function submitFeedback(messageId, isPositive) {
      const user = auth.currentUser;
      if (!user) {
        showToast('Please sign in to submit feedback.');
        return;
      }
      try {
        await addDoc(collection(db, `users/${user.uid}/feedback`), {
          messageId,
          isPositive,
          timestamp: Timestamp.now()
        });
        showToast(`Feedback ${isPositive ? '👍' : '👎'} submitted!`);
      } catch (error) {
        console.error('Failed to submit feedback:', error.message);
        showToast(`Failed to submit feedback: ${error.message}`);
      }
    }

    async function loadConversations() {
      try {
        const user = auth.currentUser;
        if (!user) return;
        const querySnapshot = await getDocs(collection(db, `users/${user.uid}/conversations`));
        conversations = [];
        chatHistory.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          conversations.push({ id: doc.id, ...data });
          const firstMessage = data.messages[0]?.text || "Conversation";
          const timestamp = formatTimestamp(data.createdAt);
          const historyItem = document.createElement("p");
          historyItem.innerHTML = `
            ${firstMessage.substring(0, 20)}${firstMessage.length > 20 ? "..." : ""}
            <span class="timestamp">${timestamp}</span>
          `;
          historyItem.dataset.conversationId = doc.id;
          historyItem.addEventListener("click", () => loadConversation(doc.id));
          chatHistory.appendChild(historyItem);
        });
      } catch (error) {
        console.error("Failed to load conversations:", error.message);
        showToast(`Failed to load conversations: ${error.message}`);
      }
    }

    async function loadConversation(conversationId) {
      try {
        const user = auth.currentUser;
        if (!user) return;
        const conversation = conversations.find(c => c.id === conversationId);
        if (!conversation) return;
        currentConversationId = conversationId;
        chatOutput.innerHTML = "";
        conversation.messages.forEach((msg, index) => {
          const timestamp = formatTimestamp(msg.timestamp);
          const messageId = `${conversationId}-${index}`;
          const feedbackButtons = msg.sender === 'ai' ? `
            <button class="feedback-btn thumbs-up" data-message-id="${messageId}" aria-label="Thumbs up">👍</button>
            <button class="feedback-btn thumbs-down" data-message-id="${messageId}" aria-label="Thumbs down">👎</button>
          ` : '';
          chatOutput.innerHTML += `
            <div class="message ${msg.sender === 'user' ? 'user-message' : 'ai-message'}">
              ${msg.text}
              <span class="timestamp">${timestamp}</span>
              ${feedbackButtons}
            </div>`;
        });
        chatOutput.scrollTop = chatOutput.scrollHeight;
        document.querySelectorAll('.feedback-btn').forEach(btn => {
          btn.removeEventListener('click', handleFeedback);
          btn.addEventListener('click', handleFeedback);
        });
      } catch (error) {
        console.error("Failed to load conversation:", error.message);
        showToast(`Failed to load conversation: ${error.message}`);
      }
    }

    async function saveMessageToConversation(text, sender) {
      try {
        const user = auth.currentUser;
        if (!user) {
          showToast("Error: User not authenticated. Please sign in again.");
          throw new Error("User not authenticated");
        }
        const message = { text, sender, timestamp: Timestamp.now() };
        if (!currentConversationId) {
          const docRef = await addDoc(collection(db, `users/${user.uid}/conversations`), {
            createdAt: Timestamp.now(),
            messages: [message]
          });
          currentConversationId = docRef.id;
          conversations.push({ id: docRef.id, createdAt: Timestamp.now(), messages: [message] });
          const historyItem = document.createElement("p");
          historyItem.innerHTML = `
            ${text.substring(0, 20)}${text.length > 20 ? "..." : ""}
            <span class="timestamp">${formatTimestamp(Timestamp.now())}</span>
          `;
          historyItem.dataset.conversationId = docRef.id;
          historyItem.addEventListener("click", () => loadConversation(docRef.id));
          chatHistory.appendChild(historyItem);
        } else {
          const conversation = conversations.find(c => c.id === currentConversationId);
          if (conversation) {
            conversation.messages.push(message);
            await setDoc(doc(db, `users/${user.uid}/conversations/${currentConversationId}`), {
              messages: conversation.messages,
              createdAt: conversation.createdAt
            }, { merge: true });
            const historyItem = chatHistory.querySelector(`[data-conversation-id="${currentConversationId}"]`);
            if (historyItem) {
              historyItem.innerHTML = `
                ${conversation.messages[0].text.substring(0, 20)}${conversation.messages[0].text.length > 20 ? "..." : ""}
                <span class="timestamp">${formatTimestamp(conversation.createdAt)}</span>
              `;
            }
          }
        }
      } catch (error) {
        console.error("Failed to save message:", error.message);
        showToast(`Failed to save message: ${error.message}`);
      }
    }

    window.sendMessage = async function () {
      const userInput = document.getElementById("user-input").value.trim();
      if (!userInput) {
        showToast("Please enter a message.");
        return;
      }

      const user = auth.currentUser;
      const isFirstInteraction = user ? await checkFirstInteraction(user) : false;
      const username = user ? (user.displayName || "User") : "User";
      const timestamp = formatTimestamp(Timestamp.now());
      chatOutput.innerHTML += `<div class="message user-message">${userInput}<span class="timestamp">${timestamp}</span></div>`;
      await saveMessageToConversation(userInput, "user");
      chatOutput.scrollTop = chatOutput.scrollHeight;

      const thinkingDiv = document.createElement("div");
      thinkingDiv.className = "thinking-dots";
      chatOutput.appendChild(thinkingDiv);
      chatOutput.scrollTop = chatOutput.scrollHeight;

      if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
      worker.postMessage({ input: userInput, isFirstInteraction, username });
      console.log('Sent to worker:', { input: userInput, isFirstInteraction, username });
      setTimeout(() => {
        const thinkingDiv = chatOutput.querySelector('.thinking-dots');
        if (thinkingDiv) {
          chatOutput.removeChild(thinkingDiv);
          const timestamp = formatTimestamp(Timestamp.now());
          chatOutput.innerHTML += `<div class="message ai-message">Response timed out. Please try again.<span class="timestamp">${timestamp}</span></div>`;
          saveMessageToConversation('Response timed out. Please try again.', 'ai');
          showToast('Response timed out.');
        }
      }, 10000); // 10-second timeout
      document.getElementById("user-input").value = "";
      chatHistory.scrollTop = chatHistory.scrollHeight;
    };

    window.startNewConversation = function () {
      currentConversationId = null;
      chatOutput.innerHTML = "";
      document.getElementById("user-input").value = "";
      showToast("Started a new conversation.");
    };

    window.signOutUser = async function () {
      showSpinner();
      try {
        const user = auth.currentUser;
        if (user) {
          await setDoc(doc(db, `users/${user.uid}`), { online: false }, { merge: true });
          await signOut(auth);
          showToast("Signed out successfully.");
          setTimeout(() => window.location.href = "signup.html", 500);
        } else showToast("No user is signed in.");
      } catch (error) {
        console.error("Sign out failed:", error.message);
        showToast(`Failed to sign out: ${error.message}`);
      } finally { hideSpinner(); }
    };

    window.goToSettings = function () {
      showSpinner();
      try {
        showToast("Redirecting to settings...");
        setTimeout(() => window.location.href = "settings.html", 500);
      } catch (error) {
        console.error("Failed to redirect to settings:", error.message);
        showToast(`Failed to redirect: ${error.message}`);
      } finally { hideSpinner(); }
    };

    toggleSidebar.addEventListener("click", () => sidebar.classList.toggle("active"));
    newChatBtn.addEventListener("click", startNewConversation);
    settingsBtn.addEventListener("click", goToSettings);
    signoutBtn.addEventListener("click", signOutUser);
    document.getElementById("user-input").addEventListener("keypress", (e) => e.key === "Enter" && sendMessage());

    document.addEventListener("DOMContentLoaded", async () => {
      showSpinner();
      await new Promise((resolve, reject) => {
        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            console.log("No user authenticated, redirecting to signup.html");
            window.location.href = "signup.html";
          } else {
            console.log("User authenticated:", user.uid);
            setUserProfile(user);
            await loadUserSettings(user);
            await loadConversations();
            resolve();
          }
        }, (error) => {
          console.error("Auth state check failed:", error);
          showToast("Authentication check failed.");
          reject(error);
        });
      });
      hideSpinner();
    });
  </script>
</body>
</html>
