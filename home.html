<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Home - MelodySphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --spotify-black: #121212;
      --spotify-green: #1DB954;
      --spotify-white: #FFFFFF;
      --spotify-grey: #535353;
      --text-dark: #FFFFFF;
      --text-light: #B3B3B3;
      --border: #282828;
      --background: #121212;
      --gradient-bg: linear-gradient(135deg, #181818 0%, #121212 100%);
      --success-green: #1DB954;
      --error-red: #E22134;
      --background-light: #F9FAFB;
      --text-dark-light: #111827;
      --text-light-light: #6B7280;
      --border-light: #D1D5DB;
      --gradient-bg-light: linear-gradient(135deg, #E0E7FF 0%, #F9FAFB 100%);
    }

    [data-theme="light"] {
      --background: var(--background-light);
      --text-dark: var(--text-dark-light);
      --text-light: var(--text-light-light);
      --border: var(--border-light);
      --gradient-bg: var(--gradient-bg-light);
    }

    body {
      font-family: 'Circular', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      transition: opacity 0.5s ease, background 0.3s ease;
      color: var(--text-dark);
      user-select: none;
      -webkit-text-size-adjust: none;
      -webkit-touch-callout: none;
    }

    body.fade-out {
      opacity: 0;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      display: none;
      width: 240px;
      background: #000000;
      padding: 1.5rem;
      flex-shrink: 0;
    }

    @media (min-width: 1024px) {
      .sidebar {
        display: block;
      }
    }

    .sidebar .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--spotify-white);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar .logo svg {
      width: 32px;
      height: 32px;
      fill: var(--spotify-green);
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-nav a {
      color: var(--text-light);
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.5rem;
      border-radius: 6px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      background: #282828;
      color: var(--spotify-white);
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      background: var(--gradient-bg);
    }

    @media (max-width: 640px) {
      .main-content {
        padding: 1rem;
      }
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      color: var(--spotify-green);
      transform: scale(1.2);
    }

    .theme-toggle svg {
      width: 24px;
      height: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .welcome-message {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      transition: transform 0.3s ease;
    }

    .profile-pic:hover {
      transform: scale(1.1);
    }

    .search-bar {
      position: relative;
      margin-bottom: 2rem;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 2.5rem;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 0.95rem;
      background: #282828;
      color: var(--spotify-white);
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .search-bar input:focus {
      border-color: var(--spotify-green);
      box-shadow: 0 0 0 3px rgba(29, 185, 84, 0.2);
    }

    .search-bar input::placeholder {
      color: var(--text-light);
    }

    .search-bar svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: var(--text-light);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .playlist-grid,
    .recently-played-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 640px) {
      .playlist-grid,
      .recently-played-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }
    }

    .card {
      background: #282828;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }

    .card-content {
      padding: 0.75rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.25rem;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .spinner-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--spotify-green);
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
    }

    .toast {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--success-green);
      color: var(--spotify-white);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      font-weight: 500;
      animation: slideIn 0.3s ease-out forwards;
    }

    .toast.active {
      display: block;
    }

    .toast.error {
      background: var(--error-red);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @media (max-width: 640px) {
      .welcome-message {
        font-size: 1.25rem;
      }

      .profile-pic {
        width: 32px;
        height: 32px;
      }

      .section-title {
        font-size: 1.1rem;
      }

      .search-bar input {
        padding: 0.5rem 2rem;
        font-size: 0.9rem;
      }

      .search-bar svg {
        width: 16px;
        height: 16px;
      }

      .toast {
        right: 10px;
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm3.5 15.5c-1.75 0-3.5-.75-4.5-2.25-.25-.5.25-1 .75-.75 1.5 1.25 3.75 1.25 5.25 0 .5-.25 1 .25.75.75-1 1.5-2.75 2.25-4.5 2.25zm1.5-4.5c-2.25 0-4.25-1-5.5-2.75-.25-.5.25-1 .75-.75 1.25 1.5 3.25 2 5 1.25.5-.25 1 .25.75.75-1.25 1.75-3.25 2.5-5.5 2.5zm1.5-4.5c-2.75 0-5-1.5-6.25-3.75-.25-.5.25-1 .75-.75 1.25 2 3.5 3 5.5 2.25.5-.25 1 .25.75.75-1.25 2.25-3.5 3.75-6.25 3.75z"/>
        </svg>
        MelodySphere
      </div>
      <nav class="sidebar-nav">
        <a href="home.html" class="active">Home</a>
        <a href="#browse">Browse</a>
        <a href="#playlists">Playlists</a>
        <a href="#profile">Profile</a>
      </nav>
    </aside>
    <main class="main-content">
      <button class="theme-toggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <header class="header">
        <h1 class="welcome-message">Welcome, <span id="username">User</span>!</h1>
        <img id="profile-pic" class="profile-pic" src="https://via.placeholder.com/40" alt="User profile picture" />
      </header>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search for songs, artists, or playlists" aria-label="Search for music" />
      </div>
      <section>
        <h2 class="section-title">Featured Playlists</h2>
        <div class="playlist-grid">
          <div class="card">
            <img src="https://via.placeholder.com/180" alt="Playlist cover" />
            <div class="card-content">
              <h3 class="card-title">Chill Hits</h3>
              <p class="card-subtitle">Relax with these soothing tracks</p>
            </div>
          </div>
          <div class="card">
            <img src="https://via.placeholder.com/180" alt="Playlist cover" />
            <div class="card-content">
              <h3 class="card-title">Pop Rising</h3>
              <p class="card-subtitle">The latest pop anthems</p>
            </div>
          </div>
          <div class="card">
            <img src="https://via.placeholder.com/180" alt="Playlist cover" />
            <div class="card-content">
              <h3 class="card-title">Rock Classics</h3>
              <p class="card-subtitle">Timeless rock hits</p>
            </div>
          </div>
        </div>
      </section>
      <section>
        <h2 class="section-title">Recently Played</h2>
        <div class="recently-played-grid">
          <div class="card">
            <img src="https://via.placeholder.com/180" alt="Track cover" />
            <div class="card-content">
              <h3 class="card-title">Song Title</h3>
              <p class="card-subtitle">Artist Name</p>
            </div>
          </div>
          <div class="card">
            <img src="https://via.placeholder.com/180" alt="Track cover" />
            <div class="card-content">
              <h3 class="card-title">Another Song</h3>
              <p class="card-subtitle">Artist Name</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
  </div>

  <div class="toast" id="toast">
    <p id="toast-message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
      authDomain: "fire-b-a8878.firebaseapp.com",
      databaseURL: "https://fire-b-a8878.firebaseio.com",
      projectId: "fire-b-a8878",
      storageBucket: "fire-b-a8878.firebasestorage.app",
      messagingSenderId: "658673187627",
      appId: "1:658673187627:web:6e4c29af661785f0afa36e",
      measurementId: "G-V4W97VMSKL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const usernameDisplay = document.getElementById("username");
    const profilePic = document.getElementById("profile-pic");
    const spinner = document.getElementById("spinner");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toast-message");
    const themeToggle = document.querySelector(".theme-toggle");

    function showSpinner() {
      spinner.classList.add("active");
    }

    function hideSpinner() {
      spinner.classList.remove("active");
    }

    function showToast(message, isError = false) {
      toastMessage.textContent = message;
      toast.classList.add("active");
      if (isError) {
        toast.classList.add("error");
      } else {
        toast.classList.remove("error");
      }
      setTimeout(() => {
        toast.classList.remove("active");
      }, 3000);
    }

    async function checkAuthState() {
      try {
        showSpinner();
        await new Promise((resolve, reject) => {
          onAuthStateChanged(auth, async (user) => {
            if (user) {
              const userRef = ref(db, `users/${user.uid}`);
              const userSnapshot = await get(userRef);
              const userData = userSnapshot.exists() ? userSnapshot.val() : {};
              usernameDisplay.textContent = userData.username || user.displayName || "User";
              profilePic.src = userData.profilePic || user.photoURL || "https://via.placeholder.com/40";
              showToast(`Welcome back, ${usernameDisplay.textContent}!`, false);
              hideSpinner();
              resolve();
            } else {
              document.body.classList.add("fade-out");
              setTimeout(() => {
                window.location.href = "index.html";
              }, 500);
            }
          }, reject);
        });
      } catch (error) {
        console.error("Auth check failed:", error);
        showToast("Failed to load user data. Please try again.", true);
        hideSpinner();
      }
    }

    function setupThemeToggle() {
      themeToggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme") || "dark";
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
      });
    }

    function applyTheme() {
      const theme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      applyTheme();
      await checkAuthState();
      setupThemeToggle();
    });
  </script>
</body>
</html>
