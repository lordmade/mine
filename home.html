<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vynix AI</title>
  <script src="https://cdn.tailwindcss.com/3.4.14"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/transformers@0.0.4/dist/transformers.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --background: #f3f4f6;
      --background-dark: #111827;
      --text: #1f2937;
      --text-light: #6b7280;
      --chat-bg: #ffffff;
      --chat-bg-dark: #1f2937;
      --message-bg: #e5e7eb;
      --message-bg-dark: #374151;
      --ai-message-bg: #e0e7ff;
      --ai-message-bg-dark: #4b5e8e;
    }

    [data-theme="dark"] {
      --background: var(--background-dark);
      --text: #f3f4f6;
      --text-light: #9ca3af;
      --chat-bg: var(--chat-bg-dark);
      --message-bg: var(--message-bg-dark);
      --ai-message-bg: var(--ai-message-bg-dark);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: url("https://source.unsplash.com/random/1920x1080?abstract") no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-container {
      display: flex;
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      background: var(--chat-bg);
      border-radius: 1rem;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar {
      width: 250px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .sidebar .profile {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar .profile .avatar {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .sidebar button {
      background: var(--primary);
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .sidebar button:hover {
      background: #4338ca;
    }

    .sidebar h2 {
      font-size: 1.2rem;
      color: var(--text);
    }

    .sidebar p {
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text-light);
      transition: background 0.2s ease;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar p:hover {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
    }

    .sidebar p .timestamp {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .chat-header h1 {
      font-size: 1.5rem;
      color: var(--text);
    }

    .chat-header button {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text);
      cursor: pointer;
      display: none;
    }

    .chat-output {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .message {
      max-width: 70%;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      position: relative;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .user-message {
      background: var(--message-bg);
      align-self: flex-end;
      margin-left: auto;
    }

    .ai-message {
      background: var(--ai-message-bg);
      align-self: flex-start;
    }

    .message .timestamp {
      font-size: 0.7rem;
      color: var(--text-light);
      margin-left: auto;
      padding-left: 0.5rem;
    }

    .feedback-btn {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 0.5rem;
      transition: color 0.2s ease;
    }

    .feedback-btn:hover {
      color: var(--primary);
    }

    .input-group {
      display: flex;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .input-group input {
      flex: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 0.5rem 0 0 0.5rem;
      background: var(--message-bg);
      color: var(--text);
      outline: none;
    }

    .input-group button {
      padding: 0.5rem 1rem;
      background: var(--primary);
      border: none;
      border-radius: 0 0.5rem 0.5rem 0;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .input-group button:hover {
      background: #4338ca;
    }

    .input-group button svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .thinking-dots {
      display: flex;
      gap: 0.3rem;
      align-self: flex-start;
      padding: 0.5rem;
    }

    .thinking-dots::before,
    .thinking-dots::after,
    .thinking-dots div {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--text-light);
      border-radius: 50%;
      animation: dot-flashing 1s infinite linear alternate;
    }

    .thinking-dots div {
      animation-delay: 0.5s;
    }

    .thinking-dots::after {
      animation-delay: 1s;
    }

    @keyframes dot-flashing {
      0% {
        opacity: 0.2;
      }
      50%,
      100% {
        opacity: 1;
      }
    }

    .spinner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .spinner-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: var(--primary);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast.active {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        height: 100vh;
        border-radius: 0;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: -250px;
        height: 100%;
        width: 250px;
        transition: left 0.3s ease;
        z-index: 1000;
      }

      .sidebar.active {
        left: 0;
      }

      .chat-header button {
        display: block;
      }

      .chat-container {
        flex: 1;
        height: 100%;
      }

      .message {
        max-width: 85%;
      }
    }

    @supports not (backdrop-filter: blur(10px)) {
      .main-container,
      .sidebar,
      .chat-header,
      .input-group {
        background: var(--chat-bg);
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar" id="user-avatar">U</div>
        <span id="username">User</span>
      </div>
      <button id="new-chat-btn">New Chat</button>
      <button id="settings-btn">Settings</button>
      <button id="signout-btn">Sign Out</button>
      <h2>Chat History</h2>
      <div id="chat-history"></div>
    </div>
    <div class="chat-container">
      <div class="chat-header">
        <h1>Vynix AI</h1>
        <button id="toggle-sidebar">☰</button>
      </div>
      <div class="chat-output" id="chat-output"></div>
      <div class="input-group">
        <input type="text" id="user-input" placeholder="Ask Vynix anything..." aria-label="Chat input" />
        <button onclick="sendMessage()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
  </div>
  <div class="toast" id="toast">
    <p id="toast-message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, setDoc, addDoc, Timestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
  apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
  authDomain: "fire-b-a8878.firebaseapp.com",
  databaseURL: "https://fire-b-a8878.firebaseio.com",
  projectId: "fire-b-a8878",
  storageBucket: "fire-b-a8878.firebasestorage.app",
  messagingSenderId: "658673187627",
  appId: "1:658673187627:web:6e4c29af661785f0afa36e",
  measurementId: "G-V4W97VMSKL"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI Elements
    const spinner = document.getElementById("spinner");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toast-message");
    const signoutBtn = document.getElementById("signout-btn");
    const settingsBtn = document.getElementById("settings-btn");
    const toggleSidebar = document.getElementById("toggle-sidebar");
    const sidebar = document.getElementById("sidebar");
    const chatHistory = document.getElementById("chat-history");
    const userAvatar = document.getElementById("user-avatar");
    const usernameElement = document.getElementById("username");
    const newChatBtn = document.getElementById("new-chat-btn");
    const chatOutput = document.getElementById("chat-output");

    // State
    let currentConversationId = null;
    let conversations = [];

    // Utility Functions
    function showSpinner() {
      spinner.classList.add("active");
    }

    function hideSpinner() {
      spinner.classList.remove("active");
    }

    function showToast(message) {
      toastMessage.textContent = message;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 3000);
    }

    function formatTimestamp(timestamp) {
      if (timestamp instanceof Timestamp) {
        const date = timestamp.toDate();
        return date.toLocaleString('en-US', { 
          hour: 'numeric', 
          minute: '2-digit', 
          hour12: true 
        });
      }
      return new Date().toLocaleString('en-US', { 
        hour: 'numeric', 
        minute: '2-digit', 
        hour12: true 
      });
    }

    function setUserProfile(user) {
      if (user) {
        const displayName = user.displayName || "User";
        usernameElement.textContent = displayName;
        if (user.photoURL) {
          userAvatar.style.background = "none";
          userAvatar.innerHTML = `<img src="${user.photoURL}" alt="User Avatar" style="width: 40px; height: 40px; border-radius: 50%;" />`;
        } else {
          userAvatar.textContent = displayName.charAt(0);
        }
      }
    }

    async function loadUserSettings(user) {
      if (!user) return;
      try {
        const userDocRef = doc(db, `users/${user.uid}`);
        const userDoc = await getDoc(userDocRef);
        if (userDoc.exists()) {
          const theme = userDoc.data().theme || "light";
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {
        console.error("Failed to load user settings:", error.message);
        showToast(`Failed to load settings: ${error.message}`);
      }
    }

    async function checkFirstInteraction(user) {
      if (!user) return false;
      const userDocRef = doc(db, `users/${user.uid}`);
      const userDoc = await getDoc(userDocRef);
      if (!userDoc.exists() || !userDoc.data().firstInteraction) {
        await setDoc(userDocRef, { firstInteraction: true }, { merge: true });
        return true;
      }
      return false;
    }

    // Web Worker for Model Inference
    const worker = new Worker('modelWorker.js');
    worker.onmessage = (e) => {
      const { response, error } = e.data;
      const thinkingDiv = chatOutput.querySelector('.thinking-dots');
      if ('vibrate' in navigator) navigator.vibrate(0);
      if (thinkingDiv) chatOutput.removeChild(thinkingDiv);
      const timestamp = formatTimestamp(Timestamp.now());
      if (error) {
        const errorMessage = 'Error processing input. Please try again.';
        chatOutput.innerHTML += `<div class="message ai-message">${errorMessage}<span class="timestamp">${timestamp}</span></div>`;
        saveMessageToConversation(errorMessage, 'ai');
        showToast(`Error: ${error}`);
      } else {
        const messageId = `${currentConversationId}-${conversations.find(c => c.id === currentConversationId).messages.length}`;
        chatOutput.innerHTML += `
          <div class="message ai-message">
            ${response}
            <span class="timestamp">${timestamp}</span>
            <button class="feedback-btn thumbs-up" data-message-id="${messageId}" aria-label="Thumbs up">👍</button>
            <button class="feedback-btn thumbs-down" data-message-id="${messageId}" aria-label="Thumbs down">👎</button>
          </div>`;
        saveMessageToConversation(response, 'ai');
        // Attach feedback listeners
        document.querySelectorAll('.feedback-btn').forEach(btn => {
          btn.removeEventListener('click', handleFeedback); // Prevent duplicate listeners
          btn.addEventListener('click', handleFeedback);
        });
      }
      chatOutput.scrollTop = chatOutput.scrollHeight;
    };

    function handleFeedback(event) {
      const btn = event.target;
      const messageId = btn.dataset.messageId;
      const isPositive = btn.classList.contains('thumbs-up');
      submitFeedback(messageId, isPositive);
    }

    // Submit Feedback
    async function submitFeedback(messageId, isPositive) {
      const user = auth.currentUser;
      if (!user) {
        showToast('Please sign in to submit feedback.');
        return;
      }
      try {
        await addDoc(collection(db, `users/${user.uid}/feedback`), {
          messageId,
          isPositive,
          timestamp: Timestamp.now()
        });
        showToast(`Feedback ${isPositive ? '👍' : '👎'} submitted!`);
      } catch (error) {
        console.error('Failed to submit feedback:', error.message);
        showToast(`Failed to submit feedback: ${error.message}`);
      }
    }

    // Load Conversations
    async function loadConversations() {
      try {
        const user = auth.currentUser;
        if (!user) return;
        const querySnapshot = await getDocs(collection(db, `users/${user.uid}/conversations`));
        conversations = [];
        chatHistory.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          conversations.push({ id: doc.id, ...data });
          const firstMessage = data.messages[0]?.text || "Conversation";
          const timestamp = formatTimestamp(data.createdAt);
          const historyItem = document.createElement("p");
          historyItem.innerHTML = `
            ${firstMessage.substring(0, 20)}${firstMessage.length > 20 ? "..." : ""}
            <span class="timestamp">${timestamp}</span>
          `;
          historyItem.dataset.conversationId = doc.id;
          historyItem.addEventListener("click", () => loadConversation(doc.id));
          chatHistory.appendChild(historyItem);
        });
      } catch (error) {
        console.error("Failed to load conversations:", error.message);
        showToast(`Failed to load conversations: ${error.message}`);
      }
    }

    // Load Specific Conversation
    async function loadConversation(conversationId) {
      try {
        const user = auth.currentUser;
        if (!user) return;
        const conversation = conversations.find(c => c.id === conversationId);
        if (!conversation) return;
        currentConversationId = conversationId;
        chatOutput.innerHTML = "";
        conversation.messages.forEach((msg, index) => {
          const timestamp = formatTimestamp(msg.timestamp);
          const messageId = `${conversationId}-${index}`;
          const feedbackButtons = msg.sender === 'ai' ? `
            <button class="feedback-btn thumbs-up" data-message-id="${messageId}" aria-label="Thumbs up">👍</button>
            <button class="feedback-btn thumbs-down" data-message-id="${messageId}" aria-label="Thumbs down">👎</button>
          ` : '';
          chatOutput.innerHTML += `
            <div class="message ${msg.sender === 'user' ? 'user-message' : 'ai-message'}">
              ${msg.text}
              <span class="timestamp">${timestamp}</span>
              ${feedbackButtons}
            </div>`;
        });
        chatOutput.scrollTop = chatOutput.scrollHeight;
        // Attach feedback listeners
        document.querySelectorAll('.feedback-btn').forEach(btn => {
          btn.removeEventListener('click', handleFeedback); // Prevent duplicate listeners
          btn.addEventListener('click', handleFeedback);
        });
      } catch (error) {
        console.error("Failed to load conversation:", error.message);
        showToast(`Failed to load conversation: ${error.message}`);
      }
    }

    // Save Message to Firestore
    async function saveMessageToConversation(text, sender) {
      try {
        const user = auth.currentUser;
        if (!user) {
          showToast("Error: User not authenticated. Please sign in again.");
          throw new Error("User not authenticated");
        }
        const message = {
          text,
          sender,
          timestamp: Timestamp.now()
        };
        if (!currentConversationId) {
          const docRef = await addDoc(collection(db, `users/${user.uid}/conversations`), {
            createdAt: Timestamp.now(),
            messages: [message]
          });
          currentConversationId = docRef.id;
          conversations.push({ id: docRef.id, createdAt: Timestamp.now(), messages: [message] });
          const historyItem = document.createElement("p");
          historyItem.innerHTML = `
            ${text.substring(0, 20)}${text.length > 20 ? "..." : ""}
            <span class="timestamp">${formatTimestamp(Timestamp.now())}</span>
          `;
          historyItem.dataset.conversationId = docRef.id;
          historyItem.addEventListener("click", () => loadConversation(docRef.id));
          chatHistory.appendChild(historyItem);
        } else {
          const conversation = conversations.find(c => c.id === currentConversationId);
          conversation.messages.push(message);
          await setDoc(doc(db, `users/${user.uid}/conversations/${currentConversationId}`), {
            messages: conversation.messages,
            createdAt: conversation.createdAt
          }, { merge: true });
          const historyItem = chatHistory.querySelector(`[data-conversation-id="${currentConversationId}"]`);
          if (historyItem) {
            historyItem.innerHTML = `
              ${conversation.messages[0].text.substring(0, 20)}${conversation.messages[0].text.length > 20 ? "..." : ""}
              <span class="timestamp">${formatTimestamp(conversation.createdAt)}</span>
            `;
          }
        }
      } catch (error) {
        console.error("Failed to save message:", error.message);
        showToast(`Failed to save message: ${error.message}`);
      }
    }

    // Send Message
    window.sendMessage = async function () {
      const userInput = document.getElementById("user-input").value.trim();
      if (!userInput) {
        showToast("Please enter a message.");
        return;
      }

      const user = auth.currentUser;
      const isFirstInteraction = user ? await checkFirstInteraction(user) : false;
      const username = user ? (user.displayName || "User") : "User";
      const timestamp = formatTimestamp(Timestamp.now());
      chatOutput.innerHTML += `<div class="message user-message">${userInput}<span class="timestamp">${timestamp}</span></div>`;
      await saveMessageToConversation(userInput, "user");
      chatOutput.scrollTop = chatOutput.scrollHeight;

      const thinkingDiv = document.createElement("div");
      thinkingDiv.className = "thinking-dots";
      chatOutput.appendChild(thinkingDiv);
      chatOutput.scrollTop = chatOutput.scrollHeight;

      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 200]);
      }

      worker.postMessage({ input: userInput, isFirstInteraction, username });
      document.getElementById("user-input").value = "";
      chatHistory.scrollTop = chatHistory.scrollHeight;
    };

    // Start New Conversation
    window.startNewConversation = function () {
      currentConversationId = null;
      chatOutput.innerHTML = "";
      document.getElementById("user-input").value = "";
      showToast("Started a new conversation.");
    };

    // Sign Out
    window.signOutUser = async function () {
      showSpinner();
      try {
        const user = auth.currentUser;
        if (user) {
          await setDoc(doc(db, `users/${user.uid}`), { online: false }, { merge: true });
          await signOut(auth);
          showToast("Signed out successfully.");
          setTimeout(() => {
            window.location.href = "signup.html";
          }, 500);
        } else {
          showToast("No user is signed in.");
        }
      } catch (error) {
        console.error("Sign out failed:", error.message);
        showToast(`Failed to sign out: ${error.message}`);
      } finally {
        hideSpinner();
      }
    };

    // Go to Settings
    window.goToSettings = function () {
      showSpinner();
      try {
        showToast("Redirecting to settings...");
        setTimeout(() => {
          window.location.href = "settings.html";
        }, 500);
      } catch (error) {
        console.error("Failed to redirect to settings:", error.message);
        showToast(`Failed to redirect: ${error.message}`);
      } finally {
        hideSpinner();
      }
    };

    // Event Listeners
    toggleSidebar.addEventListener("click", () => {
      sidebar.classList.toggle("active");
    });

    newChatBtn.addEventListener("click", startNewConversation);
    settingsBtn.addEventListener("click", goToSettings);
    signoutBtn.addEventListener("click", signOutUser);
    document.getElementById("user-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Initialize
    document.addEventListener("DOMContentLoaded", async () => {
      showSpinner();
      await new Promise((resolve, reject) => {
        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            console.log("No user authenticated, redirecting to signup.html");
            window.location.href = "signup.html";
          } else {
            console.log("User authenticated:", user.uid);
            setUserProfile(user);
            await loadUserSettings(user);
            await loadConversations();
            resolve();
          }
        }, (error) => {
          console.error("Auth state check failed:", error);
          showToast("Authentication check failed.");
          reject(error);
        });
      });
      hideSpinner();
    });
  </script>
</body>
</html>
