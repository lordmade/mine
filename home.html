<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ReelApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      color: #000;
      overflow-x: hidden;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .reel-video {
      width: 100%;
      height: auto;
      background: #000;
    }

    .reel-info {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    .user-details {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-details img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }

    .username {
      font-weight: bold;
      margin-right: 4px;
    }

    .follow-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .follow-btn:hover {
      background: #333;
    }

    .music-info {
      font-size: 12px;
      color: #555;
    }

    .interaction-bar {
      display: flex;
      justify-content: space-around;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    .interaction-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      color: #000;
      cursor: pointer;
    }

    .interaction-btn span {
      margin-top: 4px;
    }

    .comment-section {
      padding: 8px;
    }

    .comment-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .spinner-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #000;
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="reel-video" id="reelVideo">
      <!-- Video will be dynamically added -->
    </div>
    <div class="reel-info">
      <div class="user-details">
        <img src="https://via.placeholder.com/30" alt="User profile" />
        <span class="username" id="username">Lebogang Lesudi</span>
        <button class="follow-btn">Follow</button>
      </div>
      <div class="music-info" id="musicInfo">🎵 Dr Razolo - tropo</div>
    </div>
    <div class="interaction-bar">
      <div class="interaction-btn" id="likeBtn">
        👍<span id="likeCount">179</span>
      </div>
      <div class="interaction-btn" id="commentBtn">
        💬<span id="commentCount">5</span>
      </div>
      <div class="interaction-btn" id="shareBtn">
        ↗<span>0</span>
      </div>
      <div class="interaction-btn" id="saveBtn">
        ⬇<span>0</span>
      </div>
    </div>
    <div class="comment-section">
      <input type="text" class="comment-input" id="commentInput" placeholder="Add a comment..." />
    </div>
  </div>

  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
  </div>

  <script type="module">
    // Firebase configuration (replace with your own credentials)
    const firebaseConfig = {
  apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
  authDomain: "fire-b-a8878.firebaseapp.com",
  databaseURL: "https://fire-b-a8878.firebaseio.com",
  projectId: "fire-b-a8878",
  storageBucket: "fire-b-a8878.firebasestorage.app",
  messagingSenderId: "658673187627",
  appId: "1:658673187627:web:6e4c29af661785f0afa36e",
  measurementId: "G-V4W97VMSKL"
};

    // Cloudinary configuration (replace with your own credentials)
    const cloudinaryConfig = {
      cloudName: "your-cloud-name",
      uploadPreset: "your-upload-preset"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const reelVideo = document.getElementById("reelVideo");
    const usernameDisplay = document.getElementById("username");
    const musicInfo = document.getElementById("musicInfo");
    const likeCount = document.getElementById("likeCount");
    const commentCount = document.getElementById("commentCount");
    const commentInput = document.getElementById("commentInput");
    const spinner = document.getElementById("spinner");

    function showSpinner() { spinner.classList.add("active"); }
    function hideSpinner() { spinner.classList.remove("active"); }

    // Check authentication state and load initial reel
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        usernameDisplay.textContent = user.displayName || "User";
        await loadReel(user.uid);
      } else {
        window.location.href = "index.html"; // Redirect to login
      }
    });

    // Upload reel using Cloudinary API
    reelVideo.addEventListener("click", () => {
      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "video/*";
      fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (file && auth.currentUser) {
          showSpinner();
          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", cloudinaryConfig.uploadPreset);

          try {
            const response = await fetch(
              `https://api.cloudinary.com/v1_1/${cloudinaryConfig.cloudName}/video/upload`,
              { method: "POST", body: formData }
            );
            const data = await response.json();
            if (data.secure_url) {
              await saveReelToFirestore(auth.currentUser.uid, data.secure_url, file.name);
              reelVideo.innerHTML = `
                <video controls autoplay>
                  <source src="${data.secure_url}" type="video/mp4">
                  Your browser does not support the video tag.
                </video>
              `;
              alert("Reel uploaded successfully!");
              await loadReel(auth.currentUser.uid);
            } else {
              throw new Error("Upload failed");
            }
          } catch (error) {
            console.error("Upload error:", error);
            alert("Failed to upload reel. Try again.");
          } finally {
            hideSpinner();
          }
        }
      };
      fileInput.click();
    });

    async function saveReelToFirestore(uid, url, name) {
      const reelRef = doc(collection(db, `users/${uid}/reels`));
      await setDoc(reelRef, {
        url,
        name,
        likes: 0,
        comments: 0,
        timestamp: new Date().toISOString()
      });
    }

    async function loadReel(uid) {
      const reelsRef = collection(db, `users/${uid}/reels`);
      const querySnapshot = await getDocs(reelsRef);
      if (!querySnapshot.empty) {
        const latestReel = querySnapshot.docs[0].data();
        reelVideo.innerHTML = `
          <video controls autoplay>
            <source src="${latestReel.url}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;
        likeCount.textContent = latestReel.likes || 0;
        commentCount.textContent = latestReel.comments || 0;
        musicInfo.textContent = `🎵 ${latestReel.name}`; // Adjust as needed
      }
    }

    // Interaction handlers
    likeBtn.addEventListener("click", async () => {
      if (auth.currentUser) {
        const reelsRef = collection(db, `users/${auth.currentUser.uid}/reels`);
        const querySnapshot = await getDocs(reelsRef);
        if (!querySnapshot.empty) {
          const reelDoc = querySnapshot.docs[0].ref;
          const currentLikes = parseInt(likeCount.textContent) || 0;
          await updateDoc(reelDoc, { likes: currentLikes + 1 });
          likeCount.textContent = currentLikes + 1;
        }
      }
    });

    commentBtn.addEventListener("click", () => {
      if (commentInput.value.trim() && auth.currentUser) {
        // Placeholder: Add comment logic (e.g., save to a subcollection)
        let count = parseInt(commentCount.textContent) || 0;
        commentCount.textContent = count + 1;
        commentInput.value = "";
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      // Initial load handled by auth state change
    });
  </script>
</body>
</html>
