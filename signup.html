<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vynix - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #3B82F6;
      --secondary: #FFFFFF;
      --text-dark: #111827;
      --text-light: #6B7280;
      --border: rgba(255, 255, 255, 0.3);
      --background: rgba(255, 255, 255, 0.1);
      --background-fallback: #F3F4F6;
      --background-dark: rgba(0, 0, 0, 0.2);
      --background-dark-fallback: #111827;
      --text-dark-dark: #F9FAFB;
      --text-light-dark: #9CA3AF;
      --border-dark: rgba(255, 255, 255, 0.2);
      --white-dark: rgba(31, 41, 55, 0.3);
    }

    [data-theme="dark"] {
      --background: var(--background-dark);
      --background-fallback: var(--background-dark-fallback);
      --text-dark: var(--text-dark-dark);
      --text-light: var(--text-light-dark);
      --border: var(--border-dark);
      --white: var(--white-dark);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: url('https://source.unsplash.com/random/1920x1080?abstract') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease;
    }

    .signup-container {
      background: var(--background);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .signup-container h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-dark);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .input-group input {
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.95rem;
      background: var(--background);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      color: var(--text-dark);
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    .signup-btn {
      background: var(--primary);
      color: var(--secondary);
      padding: 0.75rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .signup-btn:hover {
      background: #1E3A8A;
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .login-link {
      text-align: center;
      color: var(--text-light);
      font-size: 0.9rem;
      margin-top: 1rem;
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .spinner-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--primary);
      border-top: 4px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .toast {
      display: none;
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--background);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-dark);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      font-weight: 500;
      animation: slideIn 0.3s ease-out forwards;
      border: 1px solid var(--border);
    }

    .toast.active {
      display: block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @supports not (backdrop-filter: blur(10px)) {
      .signup-container, .toast {
        background: var(--background-fallback);
      }
      [data-theme="dark"] .signup-container, [data-theme="dark"] .toast {
        background: var(--background-dark-fallback);
      }
    }

    @media (max-width: 767px) {
      .signup-container {
        padding: 1.5rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <h1>Sign Up for Vynix AI</h1>
    <div class="input-group">
      <input type="email" id="email-input" placeholder="Email" aria-label="Email input" required />
      <input type="password" id="password-input" placeholder="Password" aria-label="Password input" required />
      <input type="password" id="confirm-password-input" placeholder="Confirm Password" aria-label="Confirm password input" required />
    </div>
    <div class="signup-btn" onclick="signUp()">Sign Up</div>
    <div class="login-link">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <div class="spinner-overlay" id="spinner">
    <div class="spinner"></div>
  </div>

  <div class="toast" id="toast">
    <p id="toast-message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOyZ3As4GTuNvjemvPF_SpsC6m6vqtNhc",
      authDomain: "fire-b-a8878.firebaseapp.com",
      projectId: "fire-b-a8878",
      storageBucket: "fire-b-a8878.firebasestorage.app",
      messagingSenderId: "658673187627",
      appId: "1:658673187627:web:6e4c29af661785f0afa36e",
      measurementId: "G-V4W97VMSKL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const spinner = document.getElementById("spinner");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toast-message");

    function showSpinner() {
      spinner.classList.add("active");
    }

    function hideSpinner() {
      spinner.classList.remove("active");
    }

    function showToast(message) {
      toastMessage.textContent = message;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 3000);
    }

    async function signUp() {
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value.trim();
      const confirmPassword = document.getElementById("confirm-password-input").value.trim();

      if (!email || !password || !confirmPassword) {
        showToast("Please fill in all fields.");
        return;
      }

      if (password !== confirmPassword) {
        showToast("Passwords do not match.");
        return;
      }

      if (password.length < 6) {
        showToast("Password must be at least 6 characters long.");
        return;
      }

      showSpinner();
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Save user data to Firestore
        await setDoc(doc(db, `users/${user.uid}`), {
          email: user.email,
          theme: "light", // Default theme
          firstInteraction: false,
          createdAt: new Date()
        }, { merge: true });

        showToast("Sign up successful! Redirecting...");
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1000);
      } catch (error) {
        console.error("Sign up failed:", error.message);
        let errorMessage = "Failed to sign up.";
        if (error.code === "auth/email-already-in-use") {
          errorMessage = "Email is already in use.";
        } else if (error.code === "auth/invalid-email") {
          errorMessage = "Invalid email format.";
        } else if (error.code === "auth/weak-password") {
          errorMessage = "Password is too weak.";
        }
        showToast(errorMessage);
      } finally {
        hideSpinner();
      }
    }

    // Redirect if already signed in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "home.html";
      }
    });

    // Handle Enter key for signup
    document.getElementById("confirm-password-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") signUp();
    });
  </script>
</body>
</html>
